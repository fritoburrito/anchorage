<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Pulse Live Channel</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: #f4f7fb;
}

main {
  width: 92%;
  max-width: 1200px;
  margin: 20px auto;
}

/* FEATURED */
.featured-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}

.featured-tile {
  background: rgba(18, 24, 39, 0.92);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 14px;
  min-height: 130px;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.featured-tile:hover {
  transform: translateY(-2px);
  border-color: rgba(123,255,178,0.35);
}

.featured-tile.primary {
  min-height: 180px;
}

.tag {
  font-size: 0.7rem;
  color: #7bffb2;
  text-transform: uppercase;
}

.featured-tile h2,
.featured-tile h3 {
  margin: 8px 0 6px;
  line-height: 1.2;
}

.featured-tile p {
  margin: 0;
  color: #9aa3b2;
  font-size: 0.9rem;
  line-height: 1.35;
}

/* WEATHER */
.weather-card {
  background: rgba(18, 24, 39, 0.92);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

.weather-card h2 {
  margin: 0 0 12px;
  color: #00c6ff;
}

#weatherBox {
  font-size: 1rem;
  color: #f4f7fb;
  min-height: 54px;
}

/* GRID */
.news-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.card {
  background: #121827;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.card h3 {
  font-size: 0.95rem;
  margin: 8px 0 6px;
}

.meta {
  font-size: 0.75rem;
  color: #9aa3b2;
}

.top-nav {
  margin-bottom: 12px;
}

.top-nav a {
  font-size: 0.9rem;
  color: #9aa3b2;
  text-decoration: none;
}

.top-nav a:hover {
  color: #7bffb2;
}

.card p {
  font-size: 0.85rem;
  color: #9aa3b2;
}

@media (max-width: 800px) {
  .featured-grid {
    grid-template-columns: 1fr;
  }

  .news-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<main>

<div class="top-nav">
  <a href="index.html">← Back to Feed</a>
</div>

<div class="featured-grid">
  <article class="featured-tile primary" id="featured-main">
    <span class="tag">Top Story</span>
    <h2>Loading...</h2>
    <p></p>
  </article>

  <article class="featured-tile" id="featured-side">
    <span class="tag">Latest</span>
    <h3>Loading...</h3>
    <p></p>
  </article>
</div>

<div class="weather-card">
  <h2>Anchorage Weather</h2>
  <div id="weatherBox">Loading forecast...</div>
</div>

<div class="news-grid" id="grid"></div>

</main>

<script>
let currentFeatureIndex = 0;
let feedItems = [];

function cleanText(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return div.textContent || "";
}

function makeCard(item){
  return `
    <div class="card" onclick="window.open('${item.link}','_blank')">
      <div class="tag">${item.category}</div>
      <h3>${item.title}</h3>
      <div class="meta">${item.pubDate}</div>
      <p>${item.description}</p>
    </div>
  `;
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = feedItems.slice(0,12).map(makeCard).join("");
}

function rotateFeaturedTiles() {
  if (!feedItems.length) return;

  const main = document.getElementById("featured-main");
  const side = document.getElementById("featured-side");

  const mainItem = feedItems[currentFeatureIndex % feedItems.length];
  const sideItem = feedItems[(currentFeatureIndex + 1) % feedItems.length];

  main.querySelector("h2").textContent = mainItem.title;
  main.querySelector("p").textContent = mainItem.description;
  main.onclick = () => window.open(mainItem.link, "_blank");

  side.querySelector("h3").textContent = sideItem.title;
  side.querySelector("p").textContent = sideItem.description;
  side.onclick = () => window.open(sideItem.link, "_blank");

  currentFeatureIndex += 2;
}

async function loadWeather() {
  const box = document.getElementById("weatherBox");

  try {
    const pointsRes = await fetch(
      "https://api.weather.gov/points/61.2176,-149.8997"
    );

    if (!pointsRes.ok) {
      throw new Error("NWS points request failed");
    }

    const pointsData = await pointsRes.json();
    const forecastUrl = pointsData.properties.forecast;

    const forecastRes = await fetch(forecastUrl);

    if (!forecastRes.ok) {
      throw new Error("NWS forecast request failed");
    }

    const forecastData = await forecastRes.json();
    const current = forecastData.properties.periods[0];

    box.innerHTML = `
      <div style="font-size:34px;font-weight:bold;">
        ${current.temperature}°${current.temperatureUnit}
      </div>

      <div style="margin-top:6px;">
        ${current.shortForecast}
      </div>

      <div style="margin-top:10px;color:#9aa3b2;font-size:0.85rem;">
        Wind: ${current.windSpeed} ${current.windDirection}
      </div>

      <div style="margin-top:6px;color:#9aa3b2;font-size:0.8rem;">
        ${current.name}
      </div>
    `;
  } catch (err) {
    console.error("Weather error:", err);

    box.innerHTML = `
      <div style="color:#ff6b6b;font-weight:bold;">
        Weather unavailable
      </div>
      <div style="margin-top:6px;color:#9aa3b2;font-size:0.85rem;">
        Could not load the Anchorage forecast.
      </div>
    `;
  }
}

async function loadFeed(){
  const res = await fetch("feed.xml?t=" + Date.now());
  const txt = await res.text();
  const xml = new DOMParser().parseFromString(txt,"text/xml");

  feedItems = [...xml.querySelectorAll("item")].map(i => ({
    title: i.querySelector("title")?.textContent || "",
    link: i.querySelector("link")?.textContent || "#",
    category: i.querySelector("category")?.textContent || "general",
    pubDate: i.querySelector("pubDate")?.textContent || "",
    description: cleanText(i.querySelector("description")?.textContent || "").slice(0,120)
  }));

  renderGrid();
  rotateFeaturedTiles();
  setInterval(rotateFeaturedTiles, 10000);
}

loadFeed();
loadWeather();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
  --bg: #0B1F3A;
  --aurora: #2EFFB8;
  --ice: #6FD3FF;
  --white: #ffffff;
}

body {
  margin: 0;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.ticker {
  width: 640px;
  height: 120px;
  display: flex;
  align-items: center;
  background: linear-gradient(180deg, #0B1F3A, #071427);
  border: 1px solid rgba(46,255,184,0.3);
  border-radius: 12px;
  overflow: hidden;
}

.brand {
  width: 130px;
  text-align: center;
  font-weight: bold;
}

.brand-top {
  font-size: 28px;
  color: white;
}

.brand-bottom {
  font-size: 12px;
  color: var(--aurora);
}

.divider {
  width: 2px;
  height: 70px;
  background: var(--aurora);
}

.scroll {
  flex: 1;
  overflow: hidden;
}

.track {
  white-space: nowrap;
  animation: scroll 32s linear infinite;
  color: var(--ice);
  font-size: 22px;
  padding-left: 100%;
}

.item {
  margin-right: 44px;
}

.item::after {
  content: " •";
  color: var(--aurora);
  margin-left: 44px;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>
<div class="ticker">
  <div class="brand">
    <div class="brand-top">AK</div>
    <div class="brand-bottom">PULSE LIVE</div>
  </div>

  <div class="divider"></div>

  <div class="scroll">
    <div class="track" id="track">
      <span class="item">Loading AK Pulse Live headlines...</span>
    </div>
  </div>
</div>

<script>
const FEED_URL = "https://akpulselive.com/feed.xml";

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function setHeadlines(list) {
  const track = document.getElementById("track");

  if (!list || !list.length) {
    list = ["AK Pulse Live feed is online"];
  }

  track.innerHTML = list
    .map(h => `<span class="item">${escapeHtml(h)}</span>`)
    .join("");
}

async function loadFeed() {
  try {
    const response = await fetch(FEED_URL + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Feed fetch failed");
    }

    const text = await response.text();
    const xml = new DOMParser().parseFromString(text, "text/xml");

    const items = Array.from(xml.querySelectorAll("item"))
      .slice(0, 15)
      .map(item => {
        const title = item.querySelector("title");
        return title ? title.textContent.trim() : "";
      })
      .filter(Boolean);

    setHeadlines(items);
  } catch (err) {
    setHeadlines([
      "AK Pulse Live feed loading",
      "Anchorage headlines and weather updates",
      "Local Alaska news stream active"
    ]);
  }
}

loadFeed();
setInterval(loadFeed, 10 * 60 * 1000);
</script>

</body>
</html>

name: Update RSS feed

on:
  push:
    paths:
      - 'scripts/generate_feed.py'
      - 'scripts/import_news.py'
      - '.github/workflows/update-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies      
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt

      - name: Import news
        run: python scripts/import_news.py

      - name: Generate feed
        run: python scripts/generate_feed.py

      - name: Send summary email
        run: python scripts/send_summary_email.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed_items.json feed.xml index.html weather.html
          git diff --staged --quiet || git commit -m "Auto-update RSS feed"
          git push

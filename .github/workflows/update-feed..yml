name: Update RSS feed

on:
  push:
    paths:
      - 'data/feed_items.json'
      - 'scripts/generate_feed.py'
      - '.github/workflows/update-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate feed
        run: python scripts/generate_feed.py

      - name: Commit updated feed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html
          git diff --staged --quiet || git commit -m "Auto-update RSS feed"
          git push

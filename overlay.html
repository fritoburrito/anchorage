<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK Pulse Live OBS Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="ticker-bar">
      <div id="ticker-label">
        <img
          src="assets/akpulse-logo.png"
          alt="AK Pulse Live"
          class="ticker-logo"
        />
      </div>

      <div id="ticker-window">
        <div id="ticker-track">
          <span class="item">
            <span class="badge general">LOADING</span>
            <span class="headline-text">Connecting to feed…</span>
          </span>
        </div>
      </div>

      <div id="ticker-clock">--:--</div>
    </div>

    <div id="debug-panel" class="hidden"></div>
  </div>

  <script src="overlay.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK Pulse Live OBS Overlay</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="overlay">
    <div id="ticker-bar">
      <div id="ticker-label" aria-label="AK Pulse Live">
        <span class="rss-mark" aria-hidden="true">
          <span class="rss-dot"></span>
          <span class="rss-arc rss-arc-small"></span>
          <span class="rss-arc rss-arc-large"></span>
        </span>
        <span class="brand-ak">AK</span>
        <span class="brand-pulse">Pulse</span>
        <span class="brand-live">Live</span>
      </div>

      <div id="ticker-window">
        <div id="ticker-track">
          <span class="item">
            <span class="badge general">LOADING</span>
            <span class="headline-text">Connecting to feed…</span>
          </span>
        </div>
      </div>

      <div id="ticker-clock">--:--</div>
    </div>

    <div id="debug-panel" class="hidden"></div>
  </div>

  <script src="overlay.js?v=5"></script>
</body>
</html>
